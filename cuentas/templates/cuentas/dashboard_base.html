{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page }} - CourtlyGPS</title>
    <link rel="stylesheet" href="{% static 'core/explorar.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="{% url 'core:home' %}" class="logo">
                <span class="logo-icon">🏆</span>
                <span class="logo-text">Courtly</span>
            </a>
            <div class="nav-links" style="display: flex; justify-content: space-around; flex: 1;">
                <a href="{% url 'cuentas:home_propietario' %}">Control</a>
                <a href="{% url 'cuentas:agenda' %}">Agenda</a>
                <a href="{% url 'cuentas:configuration' %}">Configuracion</a>
                <a href="{% url 'cuentas:gestion' %}">Gestion</a>
                <a href="{% url 'cuentas:resenas' %}">Reseñas</a>
                <form action="{% url 'cuentas:logout_usuario' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-register">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <main>
        <section>
            <h2>{{ page }}</h2>
            <p>Contenido de {{ page }} aquí.</p>
        </section>
    </main>
</body>
</html>
