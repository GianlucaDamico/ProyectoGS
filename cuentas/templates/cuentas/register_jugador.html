<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Jugador</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'cuentas/register_jugador.css' %}">
</head>
<body>
    <div class="container">
        <h1>Registro de Jugador</h1>
        {% if messages %}
            <div class="django-messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>
            </div>

            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <span class="error" id="error_email"></span>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <div class="form-group">
                <label for="deporte">Deporte preferido</label>
                <select id="deporte" name="deporte" required>
                    <option value="">Selecciona un deporte</option>
                    <option value="futbol">Fútbol</option>
                    <option value="baloncesto">Baloncesto</option>
                    <option value="tennis">Tenis</option>
                    <option value="voleibol">Voleibol</option>
                    <option value="padel">Pádel</option>
                    <option value="otros">Otros</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                    <span class="error" id="error_password"></span>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Repetir contraseña</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                    <span class="error" id="error_confirm_password"></span>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="politicas" name="politicas" required>
                <label for="politicas" class="checkbox-label">
                    Acepto las <a href="#" target="_blank">políticas de privacidad</a>
                </label>
            </div>

            <button type="submit">Registrarse</button>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="#">Inicia sesión aquí</a>
            </div>
        </form>
    </div>

    <script src="{% static 'cuentas/register_validations.js' %}"></script>
    <script>
        const registerForm = document.querySelector('form[method="POST"]');

        function mostrarErrorJugador(elementId, mensaje) {
            const elemento = document.getElementById(elementId);
            elemento.textContent = mensaje;
            elemento.style.display = 'block';
        }

        function ocultarErrorJugador(elementId) {
            const elemento = document.getElementById(elementId);
            elemento.style.display = 'none';
        }

        registerForm.addEventListener('submit', function (event) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            let esValido = true;

            if (!validarEmail(email)) {
                mostrarErrorJugador('error_email', 'El email no es válido.');
                esValido = false;
            } else {
                ocultarErrorJugador('error_email');
            }

            if (!validarContraseña(password)) {
                mostrarErrorJugador('error_password', 'Mínimo 8 caracteres, incluir mayúscula, minúscula y número.');
                esValido = false;
            } else {
                ocultarErrorJugador('error_password');
            }

            if (password !== confirmPassword) {
                mostrarErrorJugador('error_confirm_password', 'Las contraseñas no coinciden.');
                esValido = false;
            } else {
                ocultarErrorJugador('error_confirm_password');
            }

            if (!esValido) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
