{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Propietario - CourtlyGPS</title>
    <link rel="stylesheet" href="{% static 'cuentas/home_usuario.css' %}">
</head>
<body>
    <header>
        <h1>Bienvenido, {{ nombre }}</h1>
        <nav>
            <form action="{% url 'cuentas:logout_usuario' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;">Cerrar Sesión</button>
            </form>
        </nav>
    </header>

    <main>
        <section>
            <h2>Panel de Propietario</h2>
            {% if complex %}
                <p>Complejo: {{ complex.name }}</p>
                <!-- Aquí puedes agregar más información sobre el complejo -->
            {% else %}
                <p>No tienes un complejo asignado.</p>
            {% endif %}
            <!-- Agrega más contenido específico para propietarios aquí -->
        </section>
    </main>
</body>
</html>
